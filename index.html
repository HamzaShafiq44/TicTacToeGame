<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-container">
      <div class="top-bar">
        <h1>Tic-Tac-Toe</h1>
        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="Switch to dark mode"
          aria-pressed="false"
        >
          Dark mode
        </button>
      </div>

      <div class="player-inputs">
        <label>
          Player 1 · X
          <input id="player-one-name" type="text" value="Player 1" maxlength="20" />
        </label>

        <label>
          Player 2 · O
          <input id="player-two-name" type="text" value="Player 2" maxlength="20" />
        </label>
      </div>

      <section class="scoreboard" aria-label="Score">
        <div class="score-card score-x">
          <span class="score-symbol" aria-hidden="true">X</span>
          <span id="score-x-name" class="score-name">Player 1</span>
          <span id="score-x" class="score-value">0</span>
        </div>
        <div class="score-card score-o">
          <span class="score-symbol" aria-hidden="true">O</span>
          <span id="score-o-name" class="score-name">Player 2</span>
          <span id="score-o" class="score-value">0</span>
        </div>
      </section>

      <p class="round-label">Round <span id="round-number">1</span></p>
      <p class="status" aria-live="polite">
        <span class="status-symbol" aria-hidden="true">X</span>
        <span class="status-message">Player 1's turn — let's play!</span>
      </p>

      <div class="game-board" aria-label="Tic-Tac-Toe board">
        <button class="cell" type="button" data-index="0" aria-label="Cell 1"></button>
        <button class="cell" type="button" data-index="1" aria-label="Cell 2"></button>
        <button class="cell" type="button" data-index="2" aria-label="Cell 3"></button>
        <button class="cell" type="button" data-index="3" aria-label="Cell 4"></button>
        <button class="cell" type="button" data-index="4" aria-label="Cell 5"></button>
        <button class="cell" type="button" data-index="5" aria-label="Cell 6"></button>
        <button class="cell" type="button" data-index="6" aria-label="Cell 7"></button>
        <button class="cell" type="button" data-index="7" aria-label="Cell 8"></button>
        <button class="cell" type="button" data-index="8" aria-label="Cell 9"></button>
      </div>

      <button id="restart-button" class="restart-button" type="button">Restart Game</button>
      <p class="restart-hint">Your scores stay here for the next round.</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
